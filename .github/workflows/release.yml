name: build-and-push

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sure base image tag override (optional; defaults to sure/Dockerfile)"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"   # например v0.0.1

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASENAME: sure_finance_ha

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          set -euo pipefail
          CONFIG_VERSION="$(awk -F'"' '/^version:/ {print $2; exit}' sure/config.yaml)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$CONFIG_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$CONFIG_VERSION" ]; then
              echo "Release tag must match sure/config.yaml: $CONFIG_VERSION"
              exit 1
            fi
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2,3}$'; then
            echo "Add-on version must contain three or four numeric components"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Sure base image
        id: base
        env:
          INPUT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DEFAULT_BASE="$(sed -n 's/^ARG SURE_BASE_IMAGE=//p' sure/Dockerfile)"
          [ -n "$DEFAULT_BASE" ] || { echo "Sure base image is missing from sure/Dockerfile"; exit 1; }

          if [ -n "$INPUT_TAG" ]; then
            if ! echo "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "Invalid Sure base image tag"
              exit 1
            fi
            BASE="ghcr.io/firmfreez/sure:${INPUT_TAG}"
          else
            BASE="$DEFAULT_BASE"
          fi

          docker manifest inspect "$BASE" >/dev/null
          echo "sure_base_image=$BASE" >> "$GITHUB_OUTPUT"
          echo "Using SURE_BASE_IMAGE=$BASE"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./sure
          file: ./sure/Dockerfile
          push: true
          build-args: |
            SURE_BASE_IMAGE=${{ steps.base.outputs.sure_base_image }}
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ env.IMAGE_BASENAME }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ env.IMAGE_BASENAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.sure_base_image }}
